# Durcissement SSH — recommandations ANSSI-BP-028 (couche 2)
#
# Drop-in à placer dans /etc/ssh/sshd_config.d/99-hardening.conf
# (le sshd_config d'Ubuntu charge ce dossier via une directive Include).
#
# Un fichier de configuration est DÉCLARATIF : une directive par ligne,
# aucune logique. On déclare la politique voulue, sshd l'applique.
#
# Toujours valider avant de recharger :  sshd -t
# Vérifier l'état réellement appliqué   :  sshd -T

PasswordAuthentication no      # le mot de passe voyage jusqu'au serveur ; la clé se prouve sans se montrer
PermitRootLogin no             # « root » existe partout : interdire la connexion directe force un compte nommé + sudo (traçabilité)
PubkeyAuthentication yes       # authentification par clé cryptographique
