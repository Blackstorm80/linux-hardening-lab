# Durcissement sysctl — recommandations ANSSI-BP-028
#
# Fichier de référence, installé par scripts/harden_anssi.sh dans
# /etc/sysctl.d/ puis appliqué. Chaque ligne porte le n° de recommandation.
#
# Un fichier dans /etc/sysctl.d/ est PERSISTANT (rejoué au démarrage), là où
# un `sysctl -w` ne survit pas à un redémarrage. C'est la forme correcte.

# --- Noyau ---
kernel.dmesg_restrict = 1          # R6  : journal noyau réservé à root
kernel.kptr_restrict = 2           # R9  : adresses noyau masquées dans /proc
kernel.randomize_va_space = 2      # R14 : ASLR complet
fs.suid_dumpable = 0               # R5  : pas de core dump pour binaires SUID
fs.protected_symlinks = 1          # R12 : liens symboliques protégés
fs.protected_hardlinks = 1         # R12 : liens matériels protégés

# --- Réseau (pile IPv4) ---
net.ipv4.ip_forward = 0                   # R52 : pas de routage (hors routeur)
net.ipv4.conf.all.accept_redirects = 0    # R53 : redirections ICMP refusées
net.ipv4.conf.all.send_redirects = 0      # R53 : pas d'émission de redirections
net.ipv4.conf.all.accept_source_route = 0 # R54 : routage par la source refusé
net.ipv4.conf.all.rp_filter = 1           # R56 : filtrage par chemin inverse
net.ipv4.conf.all.log_martians = 1        # R55 : journalisation des paquets illégitimes
net.ipv4.tcp_syncookies = 1               # R57 : protection SYN flood
net.ipv4.icmp_echo_ignore_broadcasts = 1  # R58 : ICMP broadcast ignoré
